services:
  - type: web
    name: windsight-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ELEXON_API_BASE
        value: https://data.elexon.co.uk/bmrs/api/v1
